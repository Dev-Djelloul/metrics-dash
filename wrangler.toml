name = "metrics-dash"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "MetricsDashContainer"
image = "./Dockerfile"
max_instances = 1
instance_type = "basic"

[[durable_objects.bindings]]
name = "METRICS_DASH_CONTAINER"
class_name = "MetricsDashContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsDashContainer"]
